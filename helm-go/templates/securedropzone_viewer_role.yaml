# permissions for end users to view securedropzones.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: sdz-operator
  name: securedropzone-viewer-role
rules:
- apiGroups:
  - securedropzone.securedropzone.nl
  resources:
  - securedropzones
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - securedropzone.securedropzone.nl
  resources:
  - securedropzones/status
  verbs:
  - get
