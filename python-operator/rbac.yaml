---
apiVersion: v1
kind: Namespace
metadata:
  name: python-operator
  labels:
    name: python-operator
---
apiVersion: v1
kind: ServiceAccount
metadata:
  namespace: python-operator
  name: python-operator-account
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pythonoperator-role-cluster
rules:
  - apiGroups: [""]
    resources: [pods, events]
    verbs: [create, list, watch]

  # Framework: knowing which other operators are running (i.e. peering).
  - apiGroups: [operators.samdorreboom.nl]
    resources: [securedropzones, securedropzones/status]
    verbs: [list, watch, patch, get]

  # Framework: runtime observation of namespaces & CRDs (addition/deletion).
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [list, watch]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [list, watch]

  # Framework: admission webhook configuration management.
  - apiGroups: [admissionregistration.k8s.io/v1, admissionregistration.k8s.io/v1beta1]
    resources: [validatingwebhookconfigurations, mutatingwebhookconfigurations]
    verbs: [create, patch]

  # Application: read-only access for watching cluster-wide.
  - apiGroups: [operators.samdorreboom.nl]
    resources: [securedropzones]
    verbs: [list, watch]
  - apiGroups: [""]
    resources: [pods,services]
    verbs: [create,delete,list,get]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: [create,delete,update,list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: python-operator
  name: pythonoperator-role-namespaced
rules:

  # Framework: knowing which other operators are running (i.e. peering).
  - apiGroups: [operators.samdorreboom.nl]
    resources: [securedropzones]
    verbs: [list, watch, patch, get]

  # Framework: posting the events about the handlers progress/errors.
  - apiGroups: [""]
    resources: [events]
    verbs: [create]

  # Application: watching & handling for the custom resource we declare.
  - apiGroups: [operators.samdorreboom.nl]
    resources: [securedropzones]
    verbs: [list, watch, patch]

  # Application: other resources it produces and manipulates.
  # Here, we create Jobs+PVCs+Pods, but we do not patch/update/delete them ever.
  - apiGroups: [batch, extensions]
    resources: [jobs]
    verbs: [create]
  - apiGroups: [""]
    resources: [pods,services]
    verbs: [create,delete,list,get]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: [create,delete,update,list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pythonoperator-rolebinding-cluster
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pythonoperator-role-cluster
subjects:
  - kind: ServiceAccount
    name: python-operator-account
    namespace: python-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  namespace: python-operator
  name: pythonoperator-rolebinding-namespaced
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pythonoperator-role-namespaced
subjects:
  - kind: ServiceAccount
    name: python-operator-account
    namespace: python-operator